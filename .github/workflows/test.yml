name: Send Notification
on:
  push:
    branches:
      - master
jobs:
  notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 ./ 引用工作副本，验证的是本分支的 action 而不是 master
      - name: Send Notification
        uses: ./
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          post_message: 'Action Build Success'
